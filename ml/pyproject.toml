# ============================================================================
# Transit-AI — ml/ pyproject.toml
# ----------------------------------------------------------------------------
# STUB-версия для Phase 0 (нужна для `uv sync`, чтобы workspace-члены
# `apps/backend`, `apps/assistant`, `apps/mcp` не падали с warning'ами
# "missing workspace member").
#
# Полные зависимости (torch, polars, lightgbm, xgboost, catboost) и
# entry-points будут добавлены в T-023 ("ml/ pyproject.toml + train scripts").
# ============================================================================

[project]
name = "transit-ai-ml"
version = "0.1.0"
description = "ML pipeline: train, predict, calibrate, montecarlo — вне Docker"
requires-python = ">=3.12"
readme = "../README.md"

dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10.1",
    "ruff>=0.5.7",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transit_ai"]

# === ruff (lint + format) для ml/ пакета ===
# Настройки наследуются из корневого pyproject.toml.
# Дополнительно ограничиваем проверку только нашими модулями.

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "PLR2004"]  # print() и магические числа в скриптах OK
"tests/**/*.py" = ["ANN", "PLR2004", "S101"]  # asserts и магия в тестах OK
