# ============================================================================
# Transit-AI — docker-compose для dev-окружения
# ----------------------------------------------------------------------------
# R3 reproducible: все сервисы имеют resource limits (см. T-163).
# R6 time limits: обучение не в Docker (см. clinerule 10).
#
# Сервисы:
#   postgres  — PostgreSQL 16 + TimescaleDB (гипертаблицы для predictions)
#   redis     — кэш для API responses
#   backend   — FastAPI :8000 (uvicorn)
#   frontend  — Vite build → nginx :80 → проксирует /api/* на backend:8000
#   k6        — load tester (профиль loadtest, T-160)
#
# Resource limits используют top-level формат (mem_limit, cpus, pids_limit)
# потому что docker compose v2 deploy.resources работает только в swarm mode.
#
# ML artefacts + data монтируются read-only из хоста (не в Docker — clinerule 10).
#
# Usage:
#   make up            # docker compose up -d
#   make up-loadtest   # docker compose --profile loadtest up -d
#   make loadtest-smoke
#   make down
# ============================================================================

name: transit-ai

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    # R3 reproducible: жёсткие лимиты ресурсов
    mem_limit: 1g
    mem_reservation: 512m
    cpus: "1.0"
    environment:
      POSTGRES_DB: transit_dev
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transit-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.25"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transit-net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://transit:${POSTGRES_PASSWORD:-transit_dev_only}@postgres:5432/transit_dev
      REDIS_URL: redis://redis:6379/0
      ML_ARTIFACTS_DIR: /app/ml/artifacts
      ML_DATA_DIR: /app/data
      ENV: dev
      DEBUG: "true"
      WEB_CONCURRENCY: "2"  # 2 uvicorn workers (не больше, RAM лимит 512MB)
    volumes:
      # ML artefacts + data с хоста (ML обучается скриптами, см. clinerule 10)
      - ./ml/artifacts:/app/ml/artifacts:rw
      - ./data:/app/data:rw
      # alembic directory для будущих миграций (T-015+)
      - ./apps/backend/alembic:/app/apps/backend/alembic:ro
    networks:
      - transit-net
    # Прямой доступ к API через localhost:8000 (dev-mode).
    # В проде — за reverse proxy.
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    # R3 reproducible + R6 SLA: жёсткие лимиты для предсказуемой latency
    mem_limit: 512m       # 256MB/worker × 2 workers (T-164)
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 200       # защита от fork-бомб

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Vite API URL в Docker: nginx проксирует /api/* на backend:8000
        VITE_API_URL: /api
        VITE_MAP_IMPL: ${VITE_MAP_IMPL:-osm}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - transit-net
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    # nginx + static files — минимум ресурсов
    mem_limit: 128m
    mem_reservation: 32m
    cpus: "0.25"

  # === Load testing profile (T-160, T-162) ===
  # Изолированный k6 контейнер с CPU pinning, чтобы наводящая нагрузка
  # не влияла на измеряемый backend (T-163: cpuset "0,1" → ядра 0-1).
  k6:
    image: grafana/k6:0.54.0
    container_name: transit-ai-k6
    profiles: ["loadtest"]
    network_mode: host  # Прямой доступ к localhost:8000 (где крутится backend)
    # CPU pinning: k6 жмёт только ядра 0-1, backend не страдает от наводки
    cpuset: "0,1"
    mem_limit: 1g
    mem_reservation: 512m
    cpus: "2.0"
    volumes:
      - ./tests/load:/scripts:ro                                # k6 скрипты
      - ./docs/load-profiles/reports:/reports:rw                # HTML + JSON отчёты
    environment:
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_PORT: "5665"
      K6_WEB_DASHBOARD_OPEN: "false"  # в headless Docker не пытаться открыть браузер
    # command задаётся в Makefile (разный для каждого профиля нагрузки)

  # === Harvester (T-193) — Celery worker: качает JSON во внешние источники ===
  # local mode по умолчанию (R4 hackathon-rules).
  harvester:
    build:
      context: .
      dockerfile: apps/harvester/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      HARVESTER_MODE: ${HARVESTER_MODE:-local}
      HARVESTER_CELERY_BROKER_URL: redis://redis:6379/1
      HARVESTER_CELERY_RESULT_BACKEND: redis://redis:6379/2
      HARVESTER_DATA_DIR: /app/data
      HARVESTER_EXTERNAL_DIR: /app/data/external
    volumes:
      - ./data:/app/data:rw
    networks:
      - transit-net
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"
    profiles: ["pipeline"]   # вкл. через --profile pipeline

  # === ML Pipeline (T-193) — Celery worker: train + predict ===
  # Поднимается вместе с harvester через profile `pipeline`.
  ml-pipeline:
    build:
      context: .
      dockerfile: apps/ml_pipeline/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ML_PIPELINE_CELERY_BROKER_URL: redis://redis:6379/1
      ML_PIPELINE_CELERY_RESULT_BACKEND: redis://redis:6379/2
      ML_PIPELINE_DATABASE_URL: postgresql+psycopg2://transit:${POSTGRES_PASSWORD:-transit_dev_only}@postgres:5432/transit_dev
      ML_PIPELINE_ML_ARTIFACTS_DIR: /app/ml/artifacts
      ML_PIPELINE_PREDICTIONS_DIR: /app/predictions
      ML_PIPELINE_DATA_DIR: /app/data
      PYTHONPATH: /app
    volumes:
      - ./ml:/app/ml:rw
      - ./predictions:/app/predictions:rw
      - ./data:/app/data:ro
    networks:
      - transit-net
    # R6 hackathon-rules: train ≤ 60 мин. CPU pinned чтобы не наводить на backend.
    mem_limit: 1g
    mem_reservation: 512m
    cpus: "1.0"
    profiles: ["pipeline"]

volumes:
  postgres_data:
  redis_data:

networks:
  transit-net:
    driver: bridge
