[project]
name = "transit-ai-harvester"
version = "0.1.0"
description = "Celery worker: fetches external JSON (weather, traffic, POI, events) into data/external/"
requires-python = ">=3.12"

dependencies = [
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.7",
    "mypy>=1.10.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
