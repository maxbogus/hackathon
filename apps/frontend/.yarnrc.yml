# Yarn 4 configuration.
# - nodeLinker: node-modules — use classic `node_modules/` instead of PnP.
#   Reason: vitest@2 currently fails with EBADF under PnP (Yarn 4 + Node 25 still
#   has flaky ESM loader behaviour for dependency source maps). node_modules layout
#   is fully supported and is the path of least surprise during a hackathon.
#   See: https://yarnpkg.com/configuration/yarnrc#nodeLinker
nodeLinker: node-modules
