# ============================================================================
# Transit-AI — apps/backend pyproject.toml
# ----------------------------------------------------------------------------
# STUB-версия для Phase 1 (полные deps придут в T-014, реализация в TDD-цикле).
# Минимум для `uv sync` без warning'ов и для Docker build.
# ============================================================================

[project]
name = "transit-ai-backend"
version = "0.1.0"
description = "FastAPI backend: predictions, models, insights (port 8000)"
requires-python = ">=3.12"

dependencies = [
    # HTTP / ASGI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # DB (async)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    # Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Cache
    "redis>=5.1.0",
    # HTTP client (for assistant/mcp + internal calls)
    "httpx>=0.27.0",
    # ML artefact loader
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.1",
    "ruff>=0.5.7",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",  # для TestClient
    "types-jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR2004", "S101"]
"**/scripts/**/*.py" = ["T201", "PLR2004"]
