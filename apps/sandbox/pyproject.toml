[project]
name = "transit-ai-sandbox"
version = "0.1.0"
description = "Sandbox container: restricted shell для MCP code execution"
requires-python = ">=3.12"

dependencies = [
    # stdlib only (sandbox работает в изолированной среде)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.7",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/**/*.py" = ["RUF002", "RUF003"]  # sandbox не показывается пользователю
