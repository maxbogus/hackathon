[project]
name = "transit-ai-ml-pipeline"
version = "0.1.0"
description = "Celery worker: trains models and produces predictions (writes to DB + parquet)"
requires-python = ">=3.12"

dependencies = [
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # ML — переиспользуем пакет ml/ через uv workspace
    "transit-ai-ml",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.7",
    "mypy>=1.10.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
transit-ai-ml = { workspace = true }
