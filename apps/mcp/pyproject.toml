[project]
name = "transit-ai-mcp"
version = "0.1.0"
description = "MCP 2.0 server с aggregation tools для Transit-AI (T-200)"
requires-python = ">=3.12"

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "transit-ai-sandbox",  # T-199: sandbox для run_python tool
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.7",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
transit-ai-sandbox = { workspace = true }
