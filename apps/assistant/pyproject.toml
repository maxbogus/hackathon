[project]
name = "transit-ai-assistant"
version = "0.1.0"
description = "LLM endpoint для Transit-AI (T-201) — паттерн из lawcopilot, свой код"
requires-python = ">=3.12"

dependencies = [
    # LLM clients (паттерн из lawcopilot/app/llm, но свой код)
    "litellm>=1.50.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    # HTTP
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.7",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]